<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 100vh;
        }
    </style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Initialize the map
    var map = L.map('map').setView([0, 0], 13); // Default view

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Marker for GPS location
    var marker = null;

    // Function to fetch and display the latest GPS data
    async function fetchLatestGpsData() {
        try {
            const response = await fetch('/api/gps/getLatest');
            if (!response.ok) {
                throw new Error('Failed to fetch GPS data');
            }
            const data = await response.json();

            const latitude = data.latitude;
            const longitude = data.longitude;

            // Update map view
            map.setView([latitude, longitude], 13);

            // Add/update marker
            if (marker) {
                marker.setLatLng([latitude, longitude]);
            } else {
                marker = L.marker([latitude, longitude]).addTo(map);
            }
        } catch (error) {
            console.error(error);
        }
    }

    // Fetch latest GPS data on load
    fetchLatestGpsData();

    // Refresh data every 10 seconds
    setInterval(fetchLatestGpsData, 10000);
</script>
</body>
</html>
